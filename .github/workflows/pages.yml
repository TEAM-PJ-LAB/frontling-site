# Lives in the public TEAM-PJ-LAB/frontling-site repo (copied there by scripts/publish_site.sh).
# Repository settings: Pages -> Source: Deploy from a branch -> gh-pages, / (root). Pushing gh-pages once turns Pages on.
# main is what was published; gh-pages is what is served. It only moves after the tests pass.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.js
      - run: git push origin HEAD:gh-pages
