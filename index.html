<meta name="color-scheme" content="light dark">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-A304RRr66a2YfLp4xQ+r5hAxTA2OeeiEGcj9R0fVHMI='; connect-src 'self' https://docs.google.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; form-action 'self' https://docs.google.com">
<title>Frontling</title>
<!-- Starts the project file download while the scripts are still loading. Its hash is pinned in the CSP above:
     after any edit, update the hash (site/test/page.test.js prints the expected value). -->
<script>(function(){var c;try{c=decodeURIComponent(location.hash.slice(1)).trim().toLowerCase()}catch(e){return}if(/^[a-z0-9-]{3,40}$/.test(c))window.R2C_PACK={code:c,p:fetch("packs/"+c+".json",{cache:"no-cache"}).then(function(r){return r},function(){return{ok:false,status:0}})}})();</script>
<script defer src="config.js"></script>
<script defer src="i18n.js"></script>
<script defer src="core.js"></script>
<script defer src="app.js"></script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  .narrow-box{max-width:560px;margin:24px auto}
  .prose-pre{white-space:pre-wrap}
  button[aria-disabled="true"]{opacity:.55}
  #flash:focus{outline:none}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./"><img src="logo.svg" alt="" width="28" height="28"><span>Frontling</span></a>
</header>
<p class="ai-note" id="note"></p>
<main class="wrap">
  <div class="flash" id="flash" role="status" tabindex="-1" hidden></div>
  <div id="app"></div>
</main>
<noscript><p class="wrap">이 페이지는 자바스크립트가 필요해요. / This page needs JavaScript.</p></noscript>
